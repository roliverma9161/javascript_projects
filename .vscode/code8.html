<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Independence Day 2026!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0e1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* Fireworks Canvas Background */
    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Celebration Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1.5s ease-in-out;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(90deg, #FF9933, #138808);
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Gradient Typography */
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(180deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 153, 51, 0.3);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #d1d5db;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    /* Animated Ashoka Chakra */
    .chakra-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .chakra {
      width: 80px;
      height: 80px;
      border: 4px solid #000080;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      box-shadow: 0 0 15px rgba(0, 0, 128, 0.5);
      animation: rotateChakra 10s linear infinite;
    }

    .chakra::after {
      content: '';
      width: 10px;
      height: 10px;
      background-color: #000080;
      border-radius: 50%;
      position: absolute;
      z-index: 2;
    }

    .spoke {
      position: absolute;
      width: 2px;
      height: 100%;
      background-color: #000080;
    }

    /* Audio Toggle Button */
    .btn-audio {
      margin-top: 15px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #FF9933, #138808);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-audio:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 153, 51, 0.4);
    }

    .btn-audio:active {
      transform: translateY(0);
    }

    /* Animations */
    @keyframes rotateChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Main Card UI -->
  <div class="card">
    <span class="badge">15th August</span>
    <h1>Happy Independence Day</h1>
    <p class="subtitle">Celebrating 79 Years of Freedom, Unity, and Heritage.</p>

    <!-- Animated Ashoka Chakra -->
    <div class="chakra-container">
      <div class="chakra" id="chakra"></div>
    </div>

    <!-- Music Control Button -->
    <button class="btn-audio" id="audioBtn" onclick="toggleAudio()">🔊 Play Vande Mataram</button>
  </div>

  <!-- Background Audio -->
  <audio id="bgAudio" loop src="https://upload.wikimedia.org/wikipedia/commons/9/94/Vande_Mataram_instrumental.ogg"></audio>

  <script>
    /* Dynamic 24 Spokes Generation */
    const chakra = document.getElementById('chakra');
    for (let i = 0; i < 12; i++) {
      const spoke = document.createElement('div');
      spoke.className = 'spoke';
      spoke.style.transform = `rotate(${i * 15}deg)`;
      chakra.appendChild(spoke);
    }

    /* Fireworks & Tricolor Particle Simulation */
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const tricolor = ['#FF9933', '#FFFFFF', '#138808'];
    const particles = [];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.005;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.03; // Light gravity
        this.alpha -= this.decay;
      }
    }

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.5);
      const color = tricolor[Math.floor(Math.random() * tricolor.length)];
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(10, 14, 26, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.05) {
        createFirework();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    /* Audio Toggle Handler */
    const audio = document.getElementById('bgAudio');
    const audioBtn = document.getElementById('audioBtn');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        audioBtn.textContent = '⏸️ Pause Music';
      } else {
        audio.pause();
        audioBtn.textContent = '🔊 Play Vande Mataram';
      }
    }
  </script>
</body>
</html>
